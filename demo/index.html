<style>
/* Layout: navy top bar over a light page; content in a centered 1120px column of cards. */
:root {
  --navy: #00274c;
  --navy-2: #0b3a66;
  --maize: #ffcb05;
  --maize-soft: #fff4c2;
  --bg: #f6f7f9;
  --card: #ffffff;
  --ink: #0f1b2d;
  --muted: #5b6676;
  --line: #e3e7ed;
  --green: #1f7a4d;
  --green-soft: #e6f4ec;
  --red: #c0392b;
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 2px solid var(--maize); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Top bar ── */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--navy); color: #fff; border-top: 3px solid #1d4f8c; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--navy); z-index: 41; }
.topbar-inner { max-width: 1180px; margin: 0 auto; height: 64px; display: flex; align-items: center; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.brand-mark { width: 36px; height: 36px; border-radius: 8px; background: var(--maize); color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 19px; }
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.1; }
.brand-sub { font-size: 12px; color: rgba(255,255,255,.72); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.88); }
.nav a:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav a[aria-current="page"] { background: rgba(255,255,255,.16); color: #fff; }
.top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: auto; }
.icon-btn { position: relative; width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
.icon-btn:hover { background: rgba(255,255,255,.1); }
.icon-btn svg { width: 19px; height: 19px; }
.badge-count { position: absolute; top: 2px; right: 0; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: var(--maize); color: var(--navy); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.me { width: 36px; height: 36px; border-radius: 50%; background: var(--maize); color: var(--navy); font-weight: 700; font-size: 13px; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.7); }
.menu-btn { display: none; }
.dropdown { position: absolute; right: 0; top: 46px; width: min(340px, calc(100vw - 32px)); background: var(--card); color: var(--ink); border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,20,50,.18); padding: 8px; z-index: 50; }
.dropdown h4 { margin: 6px 8px 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.drop-item { display: flex; gap: 10px; padding: 10px 8px; border-radius: 8px; text-align: left; width: 100%; }
.drop-item:hover { background: var(--bg); }
.drop-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--maize); margin-top: 7px; flex-shrink: 0; }
.drop-item.read .dot { background: transparent; }
.drop-item small { display: block; color: var(--muted); font-size: 12px; }
.rel { position: relative; }

@media (max-width: 900px) {
  .menu-btn { display: grid; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 64px; flex-direction: column; background: var(--navy); padding: 8px max(16px, env(safe-area-inset-left, 0px)) 14px; border-top: 1px solid rgba(255,255,255,.1); }
  .nav.open { display: flex; }
  .nav a { padding: 12px; }
  .brand-sub { display: none; }
}

/* ── Page shell ── */
.page { max-width: 1120px; margin: 0 auto; padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page.narrow { max-width: 860px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.page-head h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -.02em; color: var(--navy); }
.page-head p { margin: 6px 0 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,20,50,.04); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; transition: background .15s, transform .05s; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; }
.btn-navy { background: var(--navy); color: #fff; }
.btn-navy:hover { background: var(--navy-2); }
.btn-maize { background: var(--maize); color: var(--navy); }
.btn-maize:hover { background: #ffd633; }
.btn-ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--bg); }
.btn-done { background: var(--green-soft); color: var(--green); }
.btn-block { width: 100%; }
.search { position: relative; max-width: 520px; width: 100%; }
.search svg { position: absolute; left: 12px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 14px; }
.search input:focus { outline: 2px solid rgba(0,39,76,.25); border-color: var(--navy); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 20px; font-size: 14px; color: var(--muted); }
.chip { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 13px; font-weight: 500; }
.chip:hover { border-color: #c5ccd6; }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.tag { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 6px; background: var(--maize); color: var(--navy); font-size: 12px; font-weight: 600; }
.tag-navy { background: var(--navy); color: #fff; }
.tag-plain { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.tag-green { background: var(--green-soft); color: var(--green); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 13px; }
.meta svg { width: 15px; height: 15px; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: #eef1f5; color: #3d4a5c; border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.muted { color: var(--muted); }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
.stack { display: grid; gap: 14px; }

.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,39,76,.94) 0%, rgba(0,39,76,.72) 45%, rgba(0,39,76,.25) 100%); }
.hero-inner { position: relative; max-width: 1120px; margin: 0 auto; padding-block: clamp(48px, 9vw, 96px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero h1 { font-size: clamp(32px, 5.2vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; max-width: 18ch; }
.hero p { max-width: 58ch; font-size: clamp(16px, 1.8vw, 19px); color: rgba(255,255,255,.88); margin: 16px 0 28px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.hero .btn-link { color: #fff; padding: 10px 18px; font-weight: 600; font-size: 14px; }
.hero .btn-link:hover { text-decoration: underline; }
.announce { display: flex; align-items: center; gap: 12px; width: 100%; padding: 15px 20px; border-radius: 12px; background: var(--maize); color: var(--navy); font-weight: 600; box-shadow: 0 2px 8px rgba(255,203,5,.25); text-align: left; }
.announce svg { width: 18px; height: 18px; flex-shrink: 0; }
.announce .chev { margin-left: auto; transition: transform .2s; }
.announce[aria-expanded="true"] .chev { transform: rotate(90deg); }
.announce-list { margin-top: 10px; padding: 6px 20px; }
.announce-list li { padding: 12px 0; border-bottom: 1px solid var(--line); }
.announce-list li:last-child { border-bottom: 0; }
.announce-list ul { list-style: none; margin: 0; padding: 0; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; margin-top: 24px; }
.feature-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.feature { padding: 28px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: box-shadow .15s, transform .15s; }
.feature:hover { box-shadow: 0 8px 24px rgba(0,20,50,.08); transform: translateY(-2px); }
.feature .ic { width: 58px; height: 58px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; margin-bottom: 6px; }
.feature .ic svg { width: 26px; height: 26px; }
.feature h3 { font-size: 17px; color: var(--navy); }
.feature p { margin: 0; color: var(--muted); font-size: 14px; }
.feature .go { margin-top: 6px; color: var(--navy); }
.feature .go svg { width: 18px; height: 18px; }
.side { display: grid; gap: 20px; align-content: start; }
.quick { background: var(--navy); color: #fff; border-radius: 14px; padding: 20px; }
.quick h3 { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.quick h3 .sq { width: 30px; height: 30px; border-radius: 7px; background: var(--maize); color: var(--navy); display: grid; place-items: center; }
.quick h3 .sq svg { width: 16px; height: 16px; }
.quick p { color: rgba(255,255,255,.82); font-size: 14px; margin: 10px 0 16px; }
.quick ol { margin: 0 0 16px; padding-left: 20px; font-size: 14px; color: rgba(255,255,255,.9); display: grid; gap: 6px; }
.quick ol .done { text-decoration: line-through; color: rgba(255,255,255,.55); }
.impact { padding: 20px; }
.impact h3 { font-size: 15px; color: var(--navy); margin-bottom: 14px; }
.bar { height: 8px; background: #edf0f4; border-radius: 99px; overflow: hidden; margin: 6px 0 4px; }
.bar > span { display: block; height: 100%; background: var(--maize); border-radius: 99px; }
.impact dl { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 14px 0 0; font-size: 14px; }
.impact dt { color: var(--muted); }
.impact dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 34px 0 14px; }
.section-title h2 { font-size: 19px; color: var(--navy); }
.section-title a { font-size: 14px; font-weight: 600; color: var(--navy); }
.section-title a:hover { text-decoration: underline; }
@media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .feature-grid { grid-template-columns: 1fr; } }

/* ── Forum ── */
.post { padding: 20px 22px; }
.post-head { display: flex; align-items: flex-start; gap: 12px; }
.post-head .who { min-width: 0; flex: 1; }
.post-head .name { font-weight: 600; font-size: 14px; }
.post-head .sub { color: var(--muted); font-size: 12px; }
.post-head time { color: var(--muted); font-size: 13px; white-space: nowrap; }
.post h3 { font-size: 16px; color: var(--navy); margin: 12px 0 6px; overflow-wrap: anywhere; }
.post h3 a:hover { text-decoration: underline; }
.post p { margin: 0 0 12px; color: #3a4556; overflow-wrap: anywhere; }
.post-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 14px; color: var(--muted); font-size: 13px; }
.post-actions button, .post-actions a { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; }
.post-actions button:hover, .post-actions a:hover { background: var(--bg); color: var(--ink); }
.post-actions svg { width: 16px; height: 16px; }
.liked { color: var(--navy) !important; font-weight: 600; }
.liked svg { fill: var(--maize); }
.answer { padding: 18px 22px; }
.answer.best { border-color: #9fd3b6; box-shadow: 0 0 0 1px #9fd3b6; }
.endorse { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.endorse svg { width: 14px; height: 14px; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin-bottom: 16px; }
.back:hover { color: var(--navy); }
.back svg { width: 16px; height: 16px; }
.reply { padding: 18px 22px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 14px; font-weight: 600; }
.field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 14px; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid rgba(0,39,76,.25); border-color: var(--navy); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.check input { width: 16px; height: 16px; accent-color: var(--navy); }
.row-end { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

/* ── Events ── */
.filters { padding: 20px 22px; margin-bottom: 18px; }
.filters h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--navy); margin-bottom: 14px; }
.filters h3 svg { width: 18px; height: 18px; }
.filter-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.filter-row label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.filter-row select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font-size: 14px; color: var(--ink); }
@media (max-width: 800px) { .filter-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) { .filter-row { grid-template-columns: 1fr; } }
.count-line { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
.event { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.event-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.event h3 { font-size: 16px; color: var(--navy); }
.event p { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.event .facts { display: grid; gap: 6px; font-size: 14px; }
.event .facts span { display: flex; align-items: center; gap: 8px; }
.event .facts svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
.event .btn { margin-top: auto; }
.event-spacer { flex: 1; }

/* ── Resources ── */
.res { padding: 20px 22px; display: flex; gap: 16px; }
.res-icon { width: 42px; height: 42px; border-radius: 10px; background: #eef1f5; color: #4a5668; display: grid; place-items: center; flex-shrink: 0; }
.res-icon svg { width: 20px; height: 20px; }
.res-body { min-width: 0; flex: 1; }
.res h3 { font-size: 16px; color: var(--navy); margin: 8px 0 4px; }
.res p { margin: 0 0 8px; color: #3a4556; font-size: 14px; }
.res-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px; }
.res-foot .grow { flex: 1; }
.pill-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.pill-btn:hover { background: var(--bg); color: var(--ink); }
.pill-btn svg { width: 15px; height: 15px; }
.pill-btn.on { color: var(--navy); }
.pill-btn.on svg { fill: var(--maize); }

/* ── Mentors ── */
.mentor { padding: 24px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.mentor .avatar { width: 92px; height: 92px; font-size: 26px; font-weight: 500; margin-bottom: 8px; }
.mentor h3 { font-size: 17px; color: var(--navy); }
.mentor .sub { color: var(--muted); font-size: 14px; }
.match { background: var(--navy); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.mentor .tags { justify-content: center; margin: 8px 0 4px; }
.mentor p { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
.mentor .btn { margin-top: auto; }

/* ── Clubs ── */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 22px 0; }
.stat { padding: 18px 20px; display: flex; align-items: center; gap: 14px; }
.stat .ic { width: 40px; height: 40px; border-radius: 10px; background: #eef1f5; display: grid; place-items: center; color: var(--navy); }
.stat .ic svg { width: 19px; height: 19px; }
.stat b { display: block; font-size: 24px; font-weight: 700; color: var(--navy); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .stats { grid-template-columns: 1fr; } }
.maize-banner { background: var(--maize); border-radius: 14px; padding: 20px 22px; color: var(--navy); }
.maize-banner h3 { font-size: 16px; }
.maize-banner p { margin: 6px 0 12px; font-size: 14px; }
.maize-banner a { font-weight: 700; text-decoration: underline; font-size: 14px; }
.cat-head { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; }
.cat-head .ic { width: 34px; height: 34px; border-radius: 8px; background: #e9edf2; color: var(--navy); display: grid; place-items: center; font-weight: 700; }
.cat-head h2 { font-size: 20px; color: var(--navy); }
.club { padding: 16px 18px; }
.club-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.club h3 { font-size: 15px; color: var(--navy); }
.club p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.club .join { margin-top: 12px; font-size: 13px; font-weight: 600; color: var(--navy); display: inline-flex; gap: 6px; align-items: center; padding: 0; }
.club .join:hover { text-decoration: underline; }
.club .join.on { color: var(--green); }

/* ── Messages ── */
.msg-shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: min(640px, calc(100dvh - 190px)); min-height: 460px; overflow: hidden; }
.convos { border-right: 1px solid var(--line); overflow-y: auto; }
.convo { display: flex; gap: 12px; align-items: center; width: 100%; padding: 14px 16px; text-align: left; border-bottom: 1px solid var(--line); }
.convo:hover { background: var(--bg); }
.convo[aria-current="true"] { background: #eef3f9; box-shadow: inset 3px 0 0 var(--navy); }
.convo .who { min-width: 0; flex: 1; }
.convo .who b { display: block; font-size: 14px; }
.convo .who span { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo .unread { width: 9px; height: 9px; border-radius: 50%; background: var(--maize); }
.thread { display: flex; flex-direction: column; min-width: 0; }
.thread-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.thread-head b { display: block; }
.thread-head small { color: var(--muted); }
.thread-back { display: none; }
.bubbles { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: #fbfcfd; }
.bubble { max-width: 78%; padding: 9px 13px; border-radius: 14px; font-size: 14px; overflow-wrap: anywhere; }
.bubble.them { background: #eef1f5; border-bottom-left-radius: 4px; align-self: flex-start; }
.bubble.me { background: var(--navy); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.bubble time { display: block; font-size: 11px; opacity: .65; margin-top: 3px; }
.typing { color: var(--muted); font-size: 13px; font-style: italic; }
.composer { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--line); }
.composer input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
@media (max-width: 720px) {
  .msg-shell { grid-template-columns: 1fr; }
  .msg-shell.in-thread .convos { display: none; }
  .msg-shell:not(.in-thread) .thread { display: none; }
  .thread-back { display: grid; }
}

/* ── Overlays ── */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(0,20,45,.45); display: grid; place-items: start center; overflow-y: auto;
  padding: max(56px, calc(env(safe-area-inset-top, 0px) + 24px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: min(560px, 100%); padding: 24px; display: grid; gap: 16px; }
.modal h2 { font-size: 20px; color: var(--navy); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.close { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.close:hover { background: var(--bg); }
.close svg { width: 18px; height: 18px; }
.search-results { display: grid; gap: 4px; max-height: 50vh; overflow-y: auto; }
.search-results a { display: block; padding: 10px 12px; border-radius: 8px; }
.search-results a:hover, .search-results a:focus { background: var(--bg); }
.search-results small { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.demo-note { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 32px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  // ── Views ──
  function head(title, sub, action) {
    return '<div class="page-head"><div><h1>' + esc(title) + '</h1>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div>' + (action || '') + '</div>';
  }
  function searchBox(id, ph, val) {
    return '<label class="search"><span class="sr-only">' + esc(ph) + '</span>' + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' +
      '<input id="' + id + '" type="search" placeholder="' + esc(ph) + '" value="' + esc(val) + '" autocomplete="off"></label>';

  function chipRow(list, current, attr) {
    return '<div class="chips"><span>Filter:</span>' + ['All'].concat(list).map(function (c) {
      return '<button class="chip" ' + attr + '="' + esc(c) + '" aria-pressed="' + (c === current) + '">' + esc(c) + '</button>';
    }).join('') + '</div>';
  }

  function viewHome() {
    var quickItems = [['profile', 'Complete your iMpact profile', '#profile'], ['mentor', 'Connect with a mentor', '#mentorship'], ['question', 'Ask your first question', '#ask'], ['event', 'Register for an event', '#events']];

    var trending = posts.slice().sort(function (a, b) { return b.likes - a.likes; }).slice(0, 3);
    var upcoming = events.slice().sort(function (a, b) { return a.start - b.start; }).slice(0, 3);
    return '<section class="hero"><div class="hero-inner">' +
      '<h1>Welcome to BBATA</h1>' +
      '<p>BBATA is the web portal for the Ross School of Business at the University of Michigan. Connect with mentors, access resources, and engage with your community.</p>' +
      '<div class="hero-actions"><a class="btn btn-maize" href="#mentorship">Get Started ' + I.arrow + '</a><a class="btn-link" href="#events">Explore Events</a></div>' +
      '</div></section>' +
      '<div class="page">' +
      '<button class="announce" id="annBtn" aria-expanded="' + ui.annOpen + '" aria-controls="annList">' + I.bell + '<span>Important Announcements</span><span class="chev">' + I.chevron + '</span></button>' +
      '<div class="card announce-list" id="annList"' + (ui.annOpen ? '' : ' hidden') + '><ul>' + announcements.map(function (a) { return '<li><b>' + esc(a.title) + '</b><br><span class="muted">' + esc(a.text) + '</span></li>'; }).join('') + '</ul></div>' +
      '<div class="home-grid"><div>' +
      '<div class="feature-grid">' +
      feature('#forum', I.chat, 'Forum Discussions', 'Ask questions, share insights, and connect with peers') +
      feature('#events', I.calendar, 'Upcoming Events', 'Discover networking events and opportunities') +
      feature('#resources', I.book, 'Resource Hub', 'Recruiting guides, class notes, and student-created materials') +
      feature('#mentorship', I.users, 'Mentorship Matching', 'Get paired with upperclassmen who share your interests') +
      '</div>' +
      '<div class="section-title"><h2>Trending in the Forum</h2><a href="#forum">View all</a></div><div class="stack">' + trending.map(postCard).join('') + '</div>' +
      '</div>' +
      '<aside class="side">' +
      '<div class="quick"><h3><span class="sq">' + I.arrow + '</span>Quick Start</h3><p>New to BBATA? Start here to make the most of your experience.</p>' +
      '<ol>' + quickItems.map(function (q) { return '<li class="' + (ui.quick[q[0]] ? 'done' : '') + '"><a href="' + q[2] + '">' + esc(q[1]) + '</a></li>'; }).join('') + '</ol>' +
      '<a class="btn btn-maize btn-block" href="#mentorship">Get Started</a></div>' +
      '<div class="card impact"><h3>My iMpact Profile</h3>' +
      '<div style="display:flex;gap:12px;align-items:center"><span class="avatar" style="background:var(--maize);color:var(--navy);border:0">AK</span><div><b>' + ME.name + '</b><br><small class="muted">' + ME.year + ' · First year</small></div></div>' +
      '<div style="margin-top:14px;font-size:13px" class="muted">Getting started: ' + doneCount + ' of 4 done</div><div class="bar"><span style="width:' + (doneCount * 25) + '%"></span></div>' +
      '<dl><dt>Mentors connected</dt><dd>' + (1 + Object.keys(ui.connected).length) + '</dd><dt>Events registered</dt><dd>' + Object.keys(ui.registered).length + '</dd><dt>Saved resources</dt><dd>' + Object.keys(ui.saved).length + '</dd></dl>' +
      '<a class="btn btn-ghost btn-block" style="margin-top:16px" href="#profile">View profile</a></div>' +
      '<div class="card impact"><h3>Coming up</h3><div class="stack" style="gap:12px">' + upcoming.map(function (e) {
        return '<a href="#events" style="display:block"><b style="font-size:14px;color:var(--navy)">' + esc(e.title) + '</b><br><small class="muted">' + fmtDate.format(e.start) + ' · ' + fmtTime.format(e.start) + '</small></a>';
      }).join('') + '</div></div>' +
      '</aside></div></div>';
  }
  function feature(href, icon, title, text) {
    return '<a class="card feature" href="' + href + '"><span class="ic">' + icon + '</span><h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><span class="go">' + I.arrow + '</span></a>';
  }

  function postCard(p) {
    var n = p.answers.length;
    return '<article class="card post"><div class="post-head">' + avatar(p.author, null, p.anon) +
      '<div class="who"><div class="name">' + esc(p.anon ? 'Anonymous' : p.author) + '</div>' + (p.anon ? '' : '<div class="sub">' + esc(p.year) + '</div>') + '</div><time>' + ago(p.t) + '</time></div>' +
      '<h3><a href="#post-' + p.id + '">' + esc(p.title) + '</a></h3><p>' + esc(p.body) + '</p>' +
      '<div class="tags">' + p.tags.map(function (t) { return '<button class="tag" data-tag="' + esc(t) + '"># ' + esc(t) + '</button>'; }).join('') + '</div>' +
      '<div class="post-actions"><button data-like="' + p.id + '" class="' + (p.liked ? 'liked' : '') + '" aria-pressed="' + p.liked + '" aria-label="Like">' + I.thumb + p.likes + '</button>' +
      '<a href="#post-' + p.id + '">' + I.chat + n + (n === 1 ? ' response' : ' responses') + '</a></div></article>';
  }

  function viewForum() {
    var q = ui.forumQ.toLowerCase();
    var list = posts.filter(function (p) {
      if (ui.forumTag && p.tags.map(function (t) { return t.toLowerCase(); }).indexOf(ui.forumTag.toLowerCase()) < 0) return false;
      if (!q) return true;
      return (p.title + ' ' + p.body + ' ' + p.tags.join(' ')).toLowerCase().indexOf(q.replace(/^#/, '')) >= 0;
    }).sort(function (a, b) { return b.t - a.t; });
    return '<div class="page narrow">' + head('Forum', 'Ask questions, share insights, and learn from the Ross community.', '<button class="btn btn-navy" data-open="ask">' + I.plus + 'Ask Question</button>') +
      searchBox('forumSearch', 'Search discussions by title, content, or hashtags...', ui.forumQ) +
      (ui.forumTag ? '<div class="chips"><span>Showing</span><span class="tag"># ' + esc(ui.forumTag) + '</span><button class="chip" data-cleartag>Clear</button></div>' : '<div style="height:18px"></div>') +
      '<div class="stack" id="forumList">' + (list.length ? list.map(postCard).join('') : '<div class="card empty">No discussions match that search. <button class="chip" data-open="ask">Ask it yourself</button></div>') + '</div></div>';
  }

  function viewPost(id) {
    var p = posts.filter(function (x) { return x.id === id; })[0];
    if (!p) return viewForum();
    var answers = p.answers.slice().sort(function (a, b) { return (b.endorsed ? 1 : 0) - (a.endorsed ? 1 : 0) || b.likes - a.likes; });
    return '<div class="page narrow"><a class="back" href="#forum">' + I.back + 'Back to Forum</a>' +
      postCard(p).replace('<h3><a href="#post-' + p.id + '">', '<h3><a href="#post-' + p.id + '" aria-current="page">') +
      '<div class="section-title"><h2>' + answers.length + (answers.length === 1 ? ' Response' : ' Responses') + '</h2></div>' +
      '<div class="stack">' + answers.map(function (a, i) {
        return '<div class="card answer' + (a.endorsed ? ' best' : '') + '">' + (a.endorsed ? '<div class="endorse">' + I.shield + 'Endorsed by a peer mentor</div>' : '') +
          '<div class="post-head">' + avatar(a.author, null, a.anon) + '<div class="who"><div class="name">' + esc(a.anon ? 'Anonymous' : a.author) + (a.mentor ? ' <span class="tag" style="margin-left:6px">Mentor</span>' : '') + '</div>' + (a.anon ? '' : '<div class="sub">' + esc(a.year) + '</div>') + '</div><time>' + ago(a.t) + '</time></div>' +
          '<p style="margin:12px 0 0;color:#3a4556">' + esc(a.body) + '</p></div>';
      }).join('') + (answers.length ? '' : '<div class="card empty">No responses yet. Be the first to help.</div>') + '</div>' +
      '<form class="card reply" id="replyForm" style="margin-top:18px"><div class="field"><label for="replyText">Your response</label><textarea id="replyText" rows="4" required placeholder="Share what worked for you..."></textarea></div>' +
      '<div class="row-end"><label class="check"><input type="checkbox" id="replyAnon"> Respond anonymously</label><button class="btn btn-navy" type="submit">Post Response</button></div></form></div>';
  }

  function select(id, label, opts, val) {
    return '<label>' + esc(label) + '<select id="' + id + '">' + ['All'].concat(opts).map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></label>';
  }
  function viewEvents() {
    var f = ui.ev;
    var list = events.filter(function (e) {
      return (f.center === 'All' || e.center === f.center) && (f.focus === 'All' || e.focus === f.focus) && (f.program === 'All' || e.program === f.program || e.program === 'All Programs') && (f.type === 'All' || e.type === f.type);
    }).sort(function (a, b) { return a.start - b.start; });
    return '<div class="page">' + head('Events & Opportunities', 'Discover recruiting events, workshops, and networking opportunities across Ross centers and clubs.') +
      '<div class="card filters"><h3>' + I.filter + 'Filter Events</h3><div class="filter-row">' +
      select('fCenter', 'Center', CENTERS, f.center) + select('fFocus', 'Recruiting Focus', FOCUS, f.focus) + select('fProgram', 'Program', PROGRAMS, f.program) + select('fType', 'Event Type', TYPES, f.type) +
      '</div></div><p class="count-line">Showing ' + list.length + (list.length === 1 ? ' event' : ' events') + '</p>' +
      (list.length ? '<div class="grid-3">' + list.map(eventCard).join('') + '</div>' : '<div class="card empty">No events match those filters. <button class="chip" data-resetev>Reset filters</button></div>') + '</div>';
  }
  function eventCard(e) {
    var reg = ui.registered[e.id];
    return '<article class="card event"><div class="event-top"><h3>' + esc(e.title) + '</h3><span class="tag" style="flex-shrink:0">' + esc(e.type) + '</span></div><p>' + esc(e.desc) + '</p>' +
      '<div class="facts"><span>' + I.calendar + fmtDate.format(e.start) + '</span><span>' + I.clock + fmtTime.format(e.start) + ' - ' + fmtTime.format(e.end) + '</span>' +
      '<span>' + I.pin + esc(e.place) + ' <span class="tag tag-plain">' + (e.onCampus ? 'On-campus' : 'Virtual') + '</span></span></div>' +
      '<div class="tags">' + e.tags.map(function (t, i) { return '<span class="tag' + (i === e.tags.length - 1 && e.tags.length > 1 ? ' tag-plain' : '') + '">' + esc(t) + '</span>'; }).join('') + '</div>' +
      '<div class="event-spacer"></div><button class="btn btn-block ' + (reg ? 'btn-done' : 'btn-navy') + '" data-register="' + e.id + '">' + (reg ? I.check + 'Registered' : 'Register') + '</button></article>';
  }

  function viewResources() {
    var q = ui.resQ.toLowerCase();
    var list = resources.filter(function (r) {
      return (ui.resCat === 'All' || r.cat === ui.resCat) && (!q || (r.title + ' ' + r.desc + ' ' + r.cat).toLowerCase().indexOf(q) >= 0);
    }).sort(function (a, b) { return b.up - a.up; });
    return '<div class="page narrow">' + head('Resources', 'Access recruiting guides, class notes, and student-created materials.', '<button class="btn btn-navy" data-open="upload">' + I.plus + 'Upload Resource</button>') +
      searchBox('resSearch', 'Search resources...', ui.resQ) + chipRow(RES_CATS, ui.resCat, 'data-rescat') +
      '<div class="stack">' + (list.length ? list.map(function (r) {
        var voted = ui.voted[r.id], saved = ui.saved[r.id];
        return '<article class="card res"><span class="res-icon">' + I.file + '</span><div class="res-body"><span class="tag' + (r.cat === 'Tech' ? '' : ' tag-navy') + '">' + esc(r.cat) + '</span>' +
          '<h3>' + esc(r.title) + '</h3><p>' + esc(r.desc) + '</p><div class="meta"><span>By User ' + esc(r.by) + '</span><span>•</span><span>' + r.downloads + ' downloads</span><span>•</span><span>' + (r.updated === 0 ? 'Updated today' : 'Updated ' + r.updated + ' days ago') + '</span></div>' +
          '<div class="res-foot"><button class="pill-btn' + (voted ? ' on' : '') + '" data-vote="' + r.id + '" aria-pressed="' + !!voted + '" aria-label="Upvote">' + I.up + (r.up + (voted ? 1 : 0)) + '</button>' +
          '<button class="pill-btn' + (saved ? ' on' : '') + '" data-save="' + r.id + '" aria-pressed="' + !!saved + '">' + I.bookmark + (saved ? 'Saved' : 'Save') + '</button><span class="grow"></span>' +
          '<button class="btn btn-navy" data-download="' + r.id + '">' + I.download + 'Download</button></div></div></article>';
      }).join('') : '<div class="card empty">No resources match. Try another filter, or upload one.</div>') + '</div></div>';
  }

  function viewMentors() {
    var q = ui.mentorQ.toLowerCase();
    var list = mentors.filter(function (m) {
      if (ui.mentorCat === 'High Match' && m.match < 85) return false;
      if (ui.mentorCat !== 'All' && ui.mentorCat !== 'High Match' && m.area !== ui.mentorCat) return false;
      return !q || (m.name + ' ' + m.major + ' ' + m.tags.join(' ')).toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return b.match - a.match; });
    return '<div class="page">' + head('Find a Mentor', 'Connect with upperclassmen who can guide you through recruiting and coursework.') +
      searchBox('mentorSearch', 'Search mentors by name, interest, or major...', ui.mentorQ) + chipRow(MENTOR_CATS.concat(['High Match']), ui.mentorCat, 'data-mcat') +
      (list.length ? '<div class="grid-3">' + list.map(function (m) {
        var c = ui.connected[m.id] || m.id === 'm1';
        return '<article class="card mentor">' + avatar(m.name, m.img) + '<h3>' + esc(m.name) + '</h3><div class="sub">' + esc(m.year) + ' • ' + esc(m.major) + '</div><span class="match">' + m.match + '% Match</span>' +
          '<div class="tags">' + m.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div><p>' + esc(m.bio) + '</p>' +
          '<button class="btn btn-block ' + (c ? 'btn-done' : 'btn-navy') + '" data-connect="' + m.id + '">' + (c ? I.check + 'Connected · Message' : I.chat + 'Connect') + '</button></article>';
      }).join('') + '</div>' : '<div class="card empty">No mentors match that search.</div>') + '</div>';
  }

  function viewClubs() {
    var q = ui.clubQ.toLowerCase();
    var total = clubCats.reduce(function (n, c) { return n + c.clubs.length; }, 0);
    var body = clubCats.map(function (cat) {
      var list = cat.clubs.filter(function (c) { return !q || (c[0] + ' ' + c[1] + ' ' + cat.name).toLowerCase().indexOf(q) >= 0; });
      if (!list.length) return '';
      return '<div class="cat-head"><span class="ic">' + esc(cat.icon) + '</span><h2>' + esc(cat.name) + '</h2><span class="tag">' + list.length + '</span></div><div class="grid-3">' +
        list.map(function (c) {
          var key = c[0], on = ui.joined[key];
          return '<div class="card club"><div class="club-top"><h3>' + esc(c[0]) + '</h3><span class="tag tag-green">' + esc(cat.tag) + '</span></div><p>' + esc(c[1]) + '</p>' +
            '<button class="join' + (on ? ' on' : '') + '" data-join="' + esc(key) + '">' + (on ? I.check.replace('<svg', '<svg width="14" height="14"') + 'Following' : '+ Follow updates') + '</button></div>';
        }).join('') + '</div>';
    }).join('');
    return '<div class="page">' + head('Ross School Clubs & Organizations', 'Explore over 135+ student clubs and organizations at Michigan Ross. Connect with peers, develop professionally, and pursue your passions.') +
      searchBox('clubSearch', 'Search clubs by name, description, or category...', ui.clubQ) +
      '<div class="stats"><div class="card stat"><span class="ic">' + I.users + '</span><div><b>' + total + '</b><small>Total Clubs</small></div></div>' +
      '<div class="card stat"><span class="ic">' + I.globe + '</span><div><b>' + clubCats.length + '</b><small>Categories</small></div></div>' +
      '<div class="card stat"><span class="ic">' + I.trend + '</span><div><b>1,400+</b><small>Total U-M Orgs</small></div></div></div>' +
      '<div class="maize-banner"><h3>Looking for more organizations?</h3><p>Visit Maize Pages to explore all 1,400+ student organizations across the University of Michigan.</p><a href="https://maizepages.umich.edu" target="_blank" rel="noopener">Visit Maize Pages →</a></div>' +
      (body || '<div class="card empty" style="margin-top:20px">No clubs match that search.</div>') + '</div>';
  }

  function viewMessages() {
    var c = convos.filter(function (x) { return x.id === ui.convo; })[0] || convos[0];
    return '<div class="page">' + head('Messages', 'Chat with your mentors and classmates.') +
      '<div class="card msg-shell' + (ui.inThread ? ' in-thread' : '') + '"><div class="convos">' + convos.map(function (x) {
        var last = x.msgs[x.msgs.length - 1];
        return '<button class="convo" data-convo="' + x.id + '" aria-current="' + (x.id === c.id) + '">' + avatar(x.name, x.img) + '<span class="who"><b>' + esc(x.name) + '</b><span>' + esc(last ? (last.me ? 'You: ' : '') + last.text : x.role) + '</span></span>' + (x.unread ? '<span class="unread" aria-label="Unread"></span>' : '') + '</button>';
      }).join('') + '</div>' +
      '<section class="thread"><div class="thread-head"><button class="close thread-back" data-threadback aria-label="Back to conversations">' + I.back + '</button>' + avatar(c.name, c.img) + '<div><b>' + esc(c.name) + '</b><small>' + esc(c.role) + '</small></div></div>' +
      '<div class="bubbles" id="bubbles">' + c.msgs.map(function (m) { return '<div class="bubble ' + (m.me ? 'me' : 'them') + '">' + esc(m.text) + '<time>' + fmtTime.format(m.t) + '</time></div>'; }).join('') + (c.typing ? '<div class="typing">' + esc(c.name.split(' ')[0]) + ' is typing...</div>' : '') + '</div>' +
      '<form class="composer" id="composer"><label class="sr-only" for="msgInput">Message</label><input id="msgInput" placeholder="Write a message..." autocomplete="off"><button class="btn btn-navy" type="submit" aria-label="Send">' + I.send + '</button></form></section></div></div>';
  }

  function viewProfile() {
    return '<div class="page narrow">' + head('My iMpact Profile', 'How other students and mentors see you.') +
      '<div class="card" style="padding:24px;display:grid;gap:18px"><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><span class="avatar" style="width:72px;height:72px;font-size:24px;background:var(--maize);color:var(--navy);border:0">AK</span>' +
      '<div><h2 style="color:var(--navy)">' + ME.name + '</h2><div class="muted">' + ME.year + ' · First year · Pre-BBA</div></div></div>' +
      '<div><b>Career interests</b><div class="tags" style="margin-top:8px"><span class="tag">Consulting</span><span class="tag">Tech</span><span class="tag">Product Management</span></div></div>' +
      '<div><b>Goals</b><p class="muted" style="margin:6px 0 0">Figure out consulting recruiting, join one or two clubs, and land a sophomore summer internship.</p></div>' +
      '<div><b>Mentorship</b><p class="muted" style="margin:6px 0 0">Looking for a mentor · Connected with ' + (1 + Object.keys(ui.connected).length) + '</p></div>' +
      '<div><a class="btn btn-navy" href="#mentorship">Find more mentors</a></div></div></div>';
  }

  // ── Router ──
  var app = $('#app');
  function route() {
    var h = (location.hash || '#home').slice(1);
    if (h === 'ask') { history.replaceState(null, '', '#forum'); openAsk(); h = 'forum'; }
    var section = h.indexOf('post-') === 0 ? 'forum' : h;
    document.querySelectorAll('[data-nav]').forEach(function (a) { if (a.dataset.nav === section) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    $('#nav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false');
    var html;
    if (h.indexOf('post-') === 0) html = viewPost(parseInt(h.slice(5), 10));
    else html = ({ forum: viewForum, events: viewEvents, resources: viewResources, mentorship: viewMentors, clubs: viewClubs, messages: viewMessages, profile: viewProfile }[h] || viewHome)();
    app.innerHTML = html;
    if (h === 'messages') { scrollThread(); markRead(); }
  }
  function rerender(focusId) {
    var pos = focusId && document.getElementById(focusId) ? document.getElementById(focusId).selectionStart : null;
    route();
    if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus(); if (pos != null) el.setSelectionRange(pos, pos); } }
  }
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; window.scrollTo(0, 0); }
  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });

  function scrollThread() { var b = $('#bubbles'); if (b) b.scrollTop = b.scrollHeight; }
  function markRead() { var c = convos.filter(function (x) { return x.id === ui.convo; })[0]; if (c && c.unread) { c.unread = false; } }

  // ── Notifications ──
  function renderBell() {
    var unread = notes.filter(function (n) { return !n.read; }).length;
    var badge = $('#bellCount'); badge.textContent = unread; badge.hidden = unread === 0;
    $('#bellMenu').innerHTML = '<h4>Notifications</h4>' + notes.map(function (n, i) {
      return '<a class="drop-item' + (n.read ? ' read' : '') + '" href="' + n.href + '" data-note="' + i + '"><span class="dot"></span><span>' + esc(n.text) + '<small>' + esc(n.sub) + '</small></span></a>';
    }).join('');
  }
  function pushNote(text, href) { notes.unshift({ text: text, sub: 'Just now', href: href, read: false }); renderBell(); }

  // ── Modals ──
  var overlay = $('#overlay');
  function openModal(html, focusSel) {
    overlay.innerHTML = '<div class="overlay" data-backdrop><div class="card modal" role="dialog" aria-modal="true">' + html + '</div></div>';
    var f = overlay.querySelector(focusSel || 'input, textarea, button'); if (f) f.focus();
  }
  function closeModal() { overlay.innerHTML = ''; }
  function openAsk() {
    openModal('<div class="modal-head"><h2>Ask a Question</h2><button class="close" data-close aria-label="Close">' + I.close + '</button></div>' +
      '<form id="askForm" style="display:grid;gap:14px"><div class="field"><label for="askTitle">Question</label><input id="askTitle" required minlength="5" placeholder="e.g. When should sophomores start networking for IB?"></div>' +
      '<div class="field"><label for="askBody">Details</label><textarea id="askBody" rows="4" placeholder="Add context so people can give you a better answer."></textarea></div>' +
      '<div class="field"><label for="askTags">Hashtags (comma-separated)</label><input id="askTags" placeholder="Consulting, Recruiting"></div>' +
      '<label class="check"><input type="checkbox" id="askAnon"> Post anonymously (moderators can still see your name)</label>' +
      '<div class="row-end"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-navy" type="submit">Post Question</button></div></form>', '#askTitle');
  }
  function openUpload() {
    openModal('<div class="modal-head"><h2>Upload Resource</h2><button class="close" data-close aria-label="Close">' + I.close + '</button></div>' +
      '<form id="uploadForm" style="display:grid;gap:14px"><div class="field"><label for="upTitle">Title</label><input id="upTitle" required placeholder="e.g. MKT 300 Midterm Review"></div>' +
      '<div class="field"><label for="upCat">Category</label><select id="upCat">' + RES_CATS.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="upDesc">Description</label><textarea id="upDesc" rows="3" placeholder="What is it and who is it for?"></textarea></div>' +
      '<div class="field"><label for="upFile">File</label><input id="upFile" type="file"></div>' +
      '<div class="row-end"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-navy" type="submit">Upload</button></div></form>', '#upTitle');
  }
  function openSearch() {
    openModal('<div class="modal-head"><h2>Search BBATA</h2><button class="close" data-close aria-label="Close">' + I.close + '</button></div>' +
      searchBox('globalSearch', 'Search discussions, events, resources, mentors, clubs...', '') + '<div class="search-results" id="globalResults"><p class="muted" style="margin:4px 2px">Try "consulting", "PM", or "IB".</p></div>', '#globalSearch');
  }
  function globalResults(q) {
    q = q.toLowerCase().trim(); var out = [];
    if (q.length < 2) return '<p class="muted" style="margin:4px 2px">Try "consulting", "PM", or "IB".</p>';
    posts.forEach(function (p) { if ((p.title + p.body + p.tags.join(' ')).toLowerCase().indexOf(q) >= 0) out.push(['Forum', p.title, '#post-' + p.id]); });
    events.forEach(function (e) { if ((e.title + e.desc + e.tags.join(' ')).toLowerCase().indexOf(q) >= 0) out.push(['Event', e.title, '#events']); });
    resources.forEach(function (r) { if ((r.title + r.desc + r.cat).toLowerCase().indexOf(q) >= 0) out.push(['Resource', r.title, '#resources']); });
    mentors.forEach(function (m) { if ((m.name + m.major + m.tags.join(' ')).toLowerCase().indexOf(q) >= 0) out.push(['Mentor', m.name, '#mentorship']); });
    clubCats.forEach(function (c) { c.clubs.forEach(function (k) { if ((k[0] + k[1]).toLowerCase().indexOf(q) >= 0) out.push(['Club', k[0], '#clubs']); }); });
    if (!out.length) return '<p class="muted" style="margin:4px 2px">No results for "' + esc(q) + '".</p>';
    return out.slice(0, 12).map(function (r) { return '<a href="' + r[2] + '" data-close><small>' + r[0] + '</small>' + esc(r[1]) + '</a>'; }).join('');
  }

  // ── Events (clicks) ──
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a'); var bellMenu = $('#bellMenu');
    if (!e.target.closest('#bellMenu') && !e.target.closest('#bellBtn')) { bellMenu.hidden = true; $('#bellBtn').setAttribute('aria-expanded', 'false'); }
    if (e.target.matches('[data-backdrop]')) { closeModal(); return; }
    if (!t) return;
    var d = t.dataset;
    if (t.id === 'bellBtn') { bellMenu.hidden = !bellMenu.hidden; t.setAttribute('aria-expanded', String(!bellMenu.hidden)); return; }
    if (d.note != null) { notes[+d.note].read = true; renderBell(); bellMenu.hidden = true; return; }
    if (t.id === 'searchBtn') { openSearch(); return; }
    if (t.id === 'menuBtn') { var n = $('#nav'); n.classList.toggle('open'); t.setAttribute('aria-expanded', String(n.classList.contains('open'))); return; }
    if (d.close != null) { closeModal(); return; }
    if (t.id === 'annBtn') { ui.annOpen = !ui.annOpen; t.setAttribute('aria-expanded', String(ui.annOpen)); $('#annList').hidden = !ui.annOpen; return; }
    if (d.open === 'ask') { openAsk(); return; }
    if (d.open === 'upload') { openUpload(); return; }
    if (d.like) { var p = posts.filter(function (x) { return x.id === +d.like; })[0]; p.liked = !p.liked; p.likes += p.liked ? 1 : -1; rerender(); return; }
    if (d.tag) { ui.forumTag = d.tag; ui.forumQ = ''; go('#forum'); return; }
    if (d.cleartag != null) { ui.forumTag = ''; rerender(); return; }
    if (d.register) { var id = +d.register; var ev = events.filter(function (x) { return x.id === id; })[0];
      if (ui.registered[id]) { delete ui.registered[id]; toast('Registration cancelled'); } else { ui.registered[id] = true; ui.quick.event = true; toast('Registered for ' + ev.title); pushNote('You registered for "' + ev.title + '"', '#events'); }
      rerender(); return; }
    if (d.resetev != null) { ui.ev = { center: 'All', focus: 'All', program: 'All', type: 'All' }; rerender(); return; }
    if (d.rescat) { ui.resCat = d.rescat; rerender(); return; }
    if (d.vote) { ui.voted[d.vote] ? delete ui.voted[d.vote] : (ui.voted[d.vote] = true); rerender(); return; }
    if (d.save) { if (ui.saved[d.save]) { delete ui.saved[d.save]; toast('Removed from saved'); } else { ui.saved[d.save] = true; toast('Saved to your iMpact profile'); } rerender(); return; }
    if (d.download) { var r = resources.filter(function (x) { return x.id === +d.download; })[0]; r.downloads++; toast('Demo: "' + r.title + '" would download here'); rerender(); return; }
    if (d.mcat) { ui.mentorCat = d.mcat; rerender(); return; }
    if (d.connect) { connect(d.connect); return; }
    if (d.join) { if (ui.joined[d.join]) delete ui.joined[d.join]; else { ui.joined[d.join] = true; toast('Following ' + d.join); } rerender(); return; }
    if (d.convo) { ui.convo = d.convo; ui.inThread = true; rerender(); return; }
    if (d.threadback != null) { ui.inThread = false; rerender(); return; }
  });

  function connect(id) {
    var m = mentors.filter(function (x) { return x.id === id; })[0];
    var existing = convos.filter(function (c) { return c.name === m.name; })[0];
    if (!existing) {
      ui.connected[id] = true; ui.quick.mentor = true;
      existing = { id: 'c' + (convos.length + 1) + id, name: m.name, img: m.img, role: 'Mentor · ' + m.area, unread: false, msgs: [
        { me: true, t: Date.now(), text: 'Hi ' + m.name.split(' ')[0] + "! I'm a first-year interested in " + m.tags[0].toLowerCase() + '. Would you be open to a quick coffee chat?' }
      ] };
      convos.unshift(existing);
      fakeReply(existing, 'Hi Alex! Of course, happy to help. What are you hoping to learn about ' + m.tags[0].toLowerCase() + '?');
      toast('Connected with ' + m.name);
    }
    ui.convo = existing.id; ui.inThread = true; go('#messages');
  }
  function fakeReply(c, text) {
    setTimeout(function () { c.typing = true; if (location.hash === '#messages' && ui.convo === c.id) { rerender('msgInput'); } }, 700);
    setTimeout(function () {
      c.typing = false; c.msgs.push({ me: false, t: Date.now(), text: text });
      if (location.hash === '#messages' && ui.convo === c.id) rerender('msgInput'); else { c.unread = true; pushNote(c.name + ' sent you a message', '#messages'); }
    }, 2200);
  }
  var REPLIES = ['That makes sense! Want to grab coffee at Sava\'s this week?', 'Great question. I can send you my notes later today.', 'Definitely check out the Resources tab for that, there\'s a great guide.', 'Happy to help! Let me know what times work for you.'];

  // ── Forms ──
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === 'askForm') {
      var title = $('#askTitle').value.trim(); if (title.length < 5) return;
      var tags = $('#askTags').value.split(',').map(function (s) { return s.trim().replace(/^#/, ''); }).filter(Boolean).slice(0, 5);
      var anon = $('#askAnon').checked; var id = posts.reduce(function (n, p) { return Math.max(n, p.id); }, 0) + 1;
      posts.push({ id: id, author: anon ? 'Anonymous' : ME.name, anon: anon, year: ME.year, t: Date.now(), title: title, body: $('#askBody').value.trim(), tags: tags.length ? tags : ['General'], likes: 0, liked: false, answers: [] });
      ui.quick.question = true; ui.forumTag = ''; ui.forumQ = ''; closeModal(); toast('Question posted'); go('#post-' + id);
      return;
    }
    if (f.id === 'replyForm') {
      var text = $('#replyText').value.trim(); if (!text) return;
      var pid = parseInt(location.hash.slice(6), 10); var p = posts.filter(function (x) { return x.id === pid; })[0];
      p.answers.push({ author: ME.name, anon: $('#replyAnon').checked, year: ME.year, t: Date.now(), body: text, likes: 0 });
      toast('Response posted'); rerender(); return;
    }
    if (f.id === 'uploadForm') {
      resources.push({ id: resources.length + 1, cat: $('#upCat').value, title: $('#upTitle').value.trim(), desc: $('#upDesc').value.trim() || 'Shared by a Ross student.', by: 'alexkim', downloads: 0, updated: 0, up: 0 });
      closeModal(); ui.resCat = 'All'; toast('Resource uploaded'); rerender(); return;
    }
    if (f.id === 'composer') {
      var input = $('#msgInput'); var msg = input.value.trim(); if (!msg) return;
      var c = convos.filter(function (x) { return x.id === ui.convo; })[0];
      c.msgs.push({ me: true, t: Date.now(), text: msg }); rerender('msgInput'); $('#msgInput').value = '';
      fakeReply(c, REPLIES[c.msgs.length % REPLIES.length]); return;
    }
  });

  // ── Inputs ──
  document.addEventListener('input', function (e) {
    var id = e.target.id, v = e.target.value;
    if (id === 'forumSearch') { ui.forumQ = v; rerender(id); }
    else if (id === 'resSearch') { ui.resQ = v; rerender(id); }
    else if (id === 'mentorSearch') { ui.mentorQ = v; rerender(id); }
    else if (id === 'clubSearch') { ui.clubQ = v; rerender(id); }
    else if (id === 'globalSearch') { $('#globalResults').innerHTML = globalResults(v); }
  });
  document.addEventListener('change', function (e) {
    var map = { fCenter: 'center', fFocus: 'focus', fProgram: 'program', fType: 'type' };
    if (map[e.target.id]) { ui.ev[map[e.target.id]] = e.target.value; rerender(e.target.id); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeModal(); $('#bellMenu').hidden = true; } });

  // Keep "x minutes ago" fresh.
  setInterval(function () { if (!overlay.innerHTML && !/messages/.test(location.hash) && !document.activeElement.matches('input, textarea, select')) route(); }, 60000);

  renderBell();
  route();
})();
</script>
</body>
</html>
